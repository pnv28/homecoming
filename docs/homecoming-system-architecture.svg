<text x="800" y="484" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Review prefilled details</text>
<text x="800" y="518" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Correct uncertain fields</text>
<text x="800" y="552" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Choose preferred hospital</text>
<rect x="691" y="561" width="218" height="35" rx="7" fill="#E1F0E9"/>
<text x="800" y="586" font-size="18" fill="#228B9C" font-weight="700" text-anchor="middle">Confirm before search</text>
