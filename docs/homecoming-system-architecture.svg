<text x="77" y="274" font-size="18" fill="#37434D" font-weight="400" text-anchor="start">Estates · hospitals · MTR entrances</text>
<text x="77" y="298" font-size="18" fill="#37434D" font-weight="400" text-anchor="start">Bus / minibus stops · 3D pedestrian paths</text>
<path d="M483 279 L550 279" fill="none" stroke="#228B9C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="578" y="274" font-size="19" fill="#37434D" font-weight="700" text-anchor="start">Clean + standardise</text>
<text x="578" y="298" font-size="18" fill="#37434D" font-weight="400" text-anchor="start">Walking graphs + Dijkstra</text>
<path d="M949 279 L1020 279" fill="none" stroke="#228B9C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1054" y="282" font-size="21" fill="#0D2D70" font-weight="700" text-anchor="start">Saved journey costs + maps</text>
<text x="73" y="328" font-size="15" fill="#687780" font-weight="400" text-anchor="start">VPS STORAGE   GeoPackage / SQLite · NPZ · CSV / JSON · WebP / SVG · versioned files</text>
</g>
<path d="M1107 349 L1107 383" fill="none" stroke="#228B9C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1123" y="372" font-size="13" fill="#687780" font-weight="400" text-anchor="start">Reuse prepared results</text>
<g id="workflow-stage-1">
<rect x="48" y="390" width="276" height="250" rx="18" fill="#F7FAFC" stroke="#D5DFE4" stroke-width="1.4" filter="url(#soft-shadow)"/>
