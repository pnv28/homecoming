<text x="493" y="518" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">DeepSeek extracts fields</text>
<text x="493" y="552" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Validate structured output</text>
<text x="493" y="586" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Flag missing information</text>
</g>
<path d="M638 518 L655 518" fill="none" stroke="#228B9C" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
