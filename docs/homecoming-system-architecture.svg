<path d="M987 390 H1227 Q1245 390 1245 408 V450 H969 V408 Q969 390 987 390 Z" fill="#0D2D70"/>
<text x="1107" y="427" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">ESTATE RANKING</text>
<text x="1107" y="484" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Retrieve cached costs</text>
<text x="1107" y="518" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Apply area + mobility rules</text>
<text x="1107" y="552" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Scale and weight costs</text>
<text x="1107" y="586" font-size="18" fill="#0D2D70" font-weight="700" text-anchor="middle">Lower cost ranks better</text>
</g>
<path d="M1252 518 L1269 518" fill="none" stroke="#228B9C" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
