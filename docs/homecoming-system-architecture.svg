<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide-title slide-description">
<title id="slide-title">Homecoming: from application data to explainable estate rankings</title>
<desc id="slide-description">Geographic data is cleaned, converted into walking graphs, and stored as prepared journey costs and maps. The main workflow is application inputs, DeepSeek extraction, human review, Python estate ranking, and the officer dashboard. A separate on-demand walking workflow uses the same graph and produces interactive SVG. The Python engine calculates rankings; AI extracts fields and explains the top three.</desc>
<defs>
  <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#163440" flood-opacity="0.13"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#228B9C"/></marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif">
