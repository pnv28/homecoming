<text x="1414" y="518" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Costs, maps and warnings</text>
<text x="1414" y="552" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">AI explains the top three</text>
<text x="1414" y="586" font-size="18.5" fill="#37434D" font-weight="400" text-anchor="middle">Human decision support</text>
</g>
<g id="on-demand-walking">
<rect x="48" y="689" width="734" height="132" rx="16" fill="#EAF3F7" filter="url(#soft-shadow)"/>
<text x="74" y="720" font-size="17" fill="#0D2D70" font-weight="700" text-anchor="start">ON-DEMAND WALKING</text>
<rect x="663" y="701" width="93" height="26" rx="6" fill="#D4EAEF"/>
<text x="709.5" y="719" font-size="12" fill="#228B9C" font-weight="700" text-anchor="middle" letter-spacing="0.5">SVG ONLY</text>
<text x="74" y="753" font-size="20" fill="#37434D" font-weight="400" text-anchor="start">Start + destination → Dijkstra → interactive SVG</text>
<text x="74" y="783" font-size="19" fill="#37434D" font-weight="400" text-anchor="start">Original paths + DTM terrain · cached for reuse</text>
<text x="74" y="806" font-size="13" fill="#687780" font-weight="400" text-anchor="start">Uses the same eligible walking graph; terrain is a display layer.</text>
</g>
<g id="scoring-and-guardrails">
<rect x="806" y="689" width="746" height="132" rx="16" fill="#EAF3F7" filter="url(#soft-shadow)"/>
<text x="832" y="720" font-size="17" fill="#0D2D70" font-weight="700" text-anchor="start">SCORING &amp; GUARDRAILS</text>
<text x="832" y="753" font-size="19" fill="#37434D" font-weight="400" text-anchor="start">Bus + MTR walking time · hospital walking distance</text>
<text x="832" y="782" font-size="17.5" fill="#37434D" font-weight="400" text-anchor="start">Adjustable weights · operator confirmation · missing-route flags</text>
<text x="832" y="806" font-size="13" fill="#687780" font-weight="400" text-anchor="start">Hospital distances use the general walking network.</text>
</g>
<text x="50" y="855" font-size="16" fill="#687780" font-weight="400" text-anchor="start">HTML / CSS / JavaScript → Cloudflare → Caddy → Python FastAPI</text>
<text x="50" y="880" font-size="14" fill="#687780" font-weight="400" text-anchor="start">DeepSeek: extraction + explanation · Applicant session data held in memory</text>
<text x="1552" y="856" font-size="23" fill="#0D2D70" font-weight="700" text-anchor="end">homecoming.</text>
<text x="1552" y="880" font-size="12" fill="#687780" font-weight="700" text-anchor="end" letter-spacing="0.7">SYSTEM OVERVIEW</text>
</g></svg>
