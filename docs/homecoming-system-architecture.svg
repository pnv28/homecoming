<text x="48" y="106" font-size="44" fill="#0D2D70" font-weight="700" text-anchor="start">From application data to explainable estate rankings</text>
<text x="50" y="153" font-size="20" fill="#687780" font-weight="400" text-anchor="start">Precomputed walking-access data, human-reviewed inputs, and transparent scoring.</text>
<rect x="48" y="182" width="94" height="6" rx="1" fill="#228B9C"/>
